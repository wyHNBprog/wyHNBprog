server {
    listen 80;
    server_name forum.example.com;
    # HTTP 跳转 HTTPS（企微 OAuth 要求 HTTPS）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name forum.example.com;

    # SSL 证书路径（华为云申请免费证书后下载，放到此目录）
    # Let's Encrypt 方式：certbot --nginx -d forum.example.com 会自动配置
    ssl_certificate     /etc/nginx/ssl/forum.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/forum.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 前端静态文件 + API 反代
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 反代（私信实时聊天，必须单独配置 Upgrade 头）
    location /api/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SSE 反代（实时通知推送，必须关闭缓冲）
    location /api/sse {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }
}
